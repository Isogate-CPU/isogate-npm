name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both packages after npm Trusted Publisher is configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm pack:dry-run

  publish:
    if: inputs.publish == true
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --workspace=lib/isogate-replay --provenance --access public
      - run: npm publish --workspace=lib/isogate-node --provenance --access public
