name: Publish npm packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# npm trusted publishing uses the GitHub Actions OIDC identity. No npm
# authentication token is read or configured by this workflow.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm pack:dry-run
      # Configure each package's npm trusted publisher to this workflow before
      # creating a release tag. npm obtains short-lived publish authorization
      # from the job's OIDC identity.
      - run: npm publish --workspace=lib/isogate-replay --provenance --access public
      - run: npm publish --workspace=lib/isogate-node --provenance --access public